# Builds the Android port and keeps the newest APK on the "android"
# release, so one link always downloads the latest:
# https://github.com/killdano/license-revoked/releases/download/android/LicenseRevoked-android.apk
# Debug-signed: it sideloads, and isn't on any store.

name: Android

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['android/**', 'src/**', 'resources/**', 'sounds/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee ../gradle.log
      - name: Report a failed build
        if: failure()
        run: |
          echo "::error title=Android build failed::$(tail -40 gradle.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Publish the APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" LicenseRevoked-android.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "License Revoked for Android" \
            --notes "The newest Android build of License Revoked. Debug-signed for sideloading; not on any store."
          gh release upload android LicenseRevoked-android.apk --clobber
          echo "::notice title=APK::$(stat -c%s LicenseRevoked-android.apk) bytes, published to the android release"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
